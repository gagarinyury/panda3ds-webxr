name: PandaWeb
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  PandaWeb:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Site
        type: folder
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PandaWeb
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pandaweb
