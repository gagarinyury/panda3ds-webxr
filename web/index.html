<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Panda3DS on a WASM JIT</title>
<style>
  body { margin: 0; background: #14161a; color: #cfd3da; font: 13px/1.4 ui-monospace, Menlo, monospace; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  canvas { background: #000; image-rendering: pixelated; display: block; margin: 8px auto; }
  #top { width: 800px; max-width: 100%; aspect-ratio: 400/240; }
  #bottom { width: 640px; max-width: 80%; aspect-ratio: 320/240; }
  #stats { text-align: center; color: #8be28b; min-height: 1.4em; }
  #pad { text-align: center; user-select: none; -webkit-user-select: none; touch-action: none; }
  #pad .row { display: flex; justify-content: center; gap: 6px; margin: 4px 0; }
  #pad b { min-width: 46px; padding: 12px 8px; background: #2a2f38; border-radius: 8px; color: #dfe6ee; font: 600 14px system-ui; }
  #pad b.on { background: #4b86d9; }
  pre { background: #0d0f12; padding: 8px; max-height: 160px; overflow: auto; white-space: pre-wrap; }
</style>
<main>
  <canvas id="gl" width="400" height="480" style="display:none; width: 800px; max-width: 95%; margin: 8px auto"></canvas>
  <canvas id="top" width="400" height="240"></canvas>
  <canvas id="bottom" width="320" height="240"></canvas>
  <div id="pad" style="display:none">
    <div class="row"><b data-k="L">L</b><b data-k="R">R</b><b data-k="Select">Select</b><b data-k="Start">Start</b></div>
    <div class="row"><span><b data-k="Up">↑</b></span></div>
    <div class="row"><b data-k="Left">←</b><b data-k="Down">↓</b><b data-k="Right">→</b><b data-k="Y">Y</b><b data-k="X">X</b><b data-k="B">B</b><b data-k="A">A</b></div>
  </div>
  <div id="stats">loading…</div>
  <pre id="log"></pre>
</main>
<script>
const params = new URLSearchParams(location.search);
const rom = params.get('rom') || '/run/ctr-hello.3dsx';   // absolute path on the dev server / app scheme
const maxFrames = parseInt(params.get('frames') || '0');   // 0 = run forever
const report = params.get('report') === '1';               // send a result to the host (server or native app) when done
const turbo = params.get('turbo') === '1';                 // run as fast as possible (benchmark) instead of real time
const name = params.get('name') || 'run';
const useGL = params.get('gl') === '1';                     // OpenGL ES renderer on a WebGL2 canvas instead of the Null renderer + 2D canvases
const dbg = params.get('dbg') === '1';                      // post every frame (find where a crash happens)
const envs = params.get('env') || '';                       // e.g. env=JIT_NOCHAIN:1,JIT_NOFASTMEM:1
const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.panda;
const logEl = document.getElementById('log');
const errors = [];
const FRAME_MS = 1000 / 59.83;                              // 3DS refresh rate
const post = (type, payload) => { if (native) native.postMessage(JSON.stringify({ type, name, ...payload })); };
const log = (s, err) => { logEl.textContent += s + '\n'; if (err) { errors.push(s); post('error', { msg: s }); } };
var Module = {
  canvas: document.getElementById('gl'),
  print: (s) => { log(s, /\[FATAL\]/.test(s)); post('log', { msg: String(s).slice(0, 300) }); },
  printErr: (s) => { log(s, /error|fatal|abort|unsupported|failed/i.test(s)); post('log', { msg: '[err] ' + String(s).slice(0, 300) }); },
  preRun: [() => {
    for (const kv of envs.split(',').filter(Boolean)) { const [k, v] = kv.split(':'); Module.ENV[k] = v || '1'; }
    // render with no GPU backend and no audio: only the presented framebuffers are shown
    Module.FS.writeFile('/config.toml', `[GPU]\nRenderer = "${useGL ? 'opengl' : 'null'}"\nEnableShaderJIT = false\n[Audio]\nEnableAudio = false\nDSPEmulation = "Null"\n`);
  }],
  onRuntimeInitialized: () => start().catch((e) => { log('start failed: ' + e, true); finish(); }),
};
let t0 = 0, frames = 0, running = true, worst = 0, sum = 0, late = 0, lastTick = 0, acc = 0, lastBeat = 0, hitches = 0;
const ctx = ['top', 'bottom'].map((id) => document.getElementById(id).getContext('2d'));
const imgs = [new ImageData(400, 240), new ImageData(320, 240)];
const mem = () => { const j = Module.jit && Module.jit.impls[0]; return { wasmMB: Math.round(Module.HEAPU8.length / 1048576), blocks: j ? (j.count || 0) : 0, jitKB: j ? Math.round((j.bytes || 0) / 1024) : 0 }; };

function draw() {
  if (useGL) return;
  [1, 0].forEach((top) => {
    const p = Module._web_screen(top);
    if (!p) return;
    const n = top ? 400 * 240 * 4 : 320 * 240 * 4;
    imgs[top ? 0 : 1].data.set(Module.HEAPU8.subarray(p, p + n));
    ctx[top ? 0 : 1].putImageData(imgs[top ? 0 : 1], 0, 0);
  });
}

// ---- WebGL redundancy filter: the PICA renderer re-sets the same state before every draw (Doom: ~170 draws per frame, ~10 GL calls each),
// and every WebGL call costs ~10-30 us. Skip calls that would not change anything. Opt-in with filter=1. ----
function installGLFilter() {
  const P = WebGL2RenderingContext.prototype, wrap = (name, make) => { const o = P[name]; P[name] = make(o); };
  let vp = null, unit = 0, bc = null;
  const tex = new Map(), ubo = new Map(), fbTex = new Map(), bound = { 36160: null, 36009: null, 36008: null };
  wrap('viewport', (o) => function (x, y, w, h) { if (vp && vp[0] === x && vp[1] === y && vp[2] === w && vp[3] === h) return; vp = [x, y, w, h]; return o.call(this, x, y, w, h); });
  wrap('activeTexture', (o) => function (u) { if (u === unit) return; unit = u; return o.call(this, u); });
  wrap('bindTexture', (o) => function (t, h) { const k = unit * 100000 + t; if (tex.get(k) === h) return; tex.set(k, h); return o.call(this, t, h); });
  wrap('blendColor', (o) => function (r, g, b, a) { if (bc && bc[0] === r && bc[1] === g && bc[2] === b && bc[3] === a) return; bc = [r, g, b, a]; return o.call(this, r, g, b, a); });
  wrap('bindBufferRange', (o) => function (t, i, b, off, size) { const k = t * 1000 + i, v = ubo.get(k); if (v && v[0] === b && v[1] === off && v[2] === size) return; ubo.set(k, [b, off, size]); return o.call(this, t, i, b, off, size); });
  wrap('bindFramebuffer', (o) => function (t, f) { if (t === 36160) { bound[36160] = bound[36009] = bound[36008] = f; } else bound[t] = f; return o.call(this, t, f); });
  wrap('framebufferTexture2D', (o) => function (t, a, tt, h, lvl) {
    const f = t === 36008 ? bound[36008] : (t === 36009 ? bound[36009] : bound[36160]); let m = fbTex.get(f);
    if (!m) fbTex.set(f, m = new Map());
    const k = a + ':' + tt + ':' + lvl; if (m.get(k) === h) return; m.set(k, h); return o.call(this, t, a, tt, h, lvl);
  });
  // any change that could invalidate a cached binding resets the caches
  const reset = () => { tex.clear(); ubo.clear(); fbTex.clear(); vp = null; };
  for (const n of ['deleteTexture', 'deleteFramebuffer', 'deleteBuffer', 'deleteProgram', 'deleteVertexArray']) wrap(n, (o) => function (...a) { reset(); return o.apply(this, a); });
  for (const n of ['texImage2D', 'texStorage2D', 'texStorage3D', 'texImage3D', 'renderbufferStorage']) wrap(n, (o) => function (...a) { fbTex.clear(); return o.apply(this, a); });   // storage (re)specification can detach it from an FBO
}
if (useGL && params.get('filter') === '1') installGLFilter();   // opt-in: measured no gain on Doom (the cost is per draw, not redundant state)

// ---- input: keyboard, touch / mouse on the bottom screen, on-screen buttons ----
const KEYS = { A: 1, B: 2, Select: 4, Start: 8, Right: 16, Left: 32, Up: 64, Down: 128, R: 256, L: 512, X: 1024, Y: 2048 };
const KEYMAP = { KeyX: 'A', KeyZ: 'B', KeyS: 'X', KeyA: 'Y', KeyQ: 'L', KeyW: 'R', Enter: 'Start', ShiftRight: 'Select', Backspace: 'Select',
                 ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right' };
const held = new Set();
function press(name, down) {
  if (!Module._web_key) return;
  down ? held.add(name) : held.delete(name);
  Module._web_key(KEYS[name], down ? 1 : 0);
  document.querySelectorAll(`#pad b[data-k="${name}"]`).forEach((e) => e.classList.toggle('on', down));
}
addEventListener('keydown', (e) => { const n = KEYMAP[e.code]; if (n) { e.preventDefault(); if (!e.repeat) press(n, true); } });
addEventListener('keyup', (e) => { const n = KEYMAP[e.code]; if (n) { e.preventDefault(); press(n, false); } });
document.querySelectorAll('#pad b').forEach((b) => {
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); press(b.dataset.k, true); });
  const up = () => press(b.dataset.k, false);
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
});
function touchAt(e, down) {   // GL canvas is 400x480; the bottom screen (320x240) sits centred under the top one: x 40..360, y 240..480
  if (!Module._web_touch) return;
  const c = document.getElementById('gl'), r = c.getBoundingClientRect();
  const x = (e.clientX - r.left) * 400 / r.width - 40, y = (e.clientY - r.top) * 480 / r.height - 240;
  if (down && x >= 0 && x < 320 && y >= 0 && y < 240) Module._web_touch(Math.floor(x), Math.floor(y), 1); else Module._web_touch(0, 0, 0);
}
{
  const c = document.getElementById('gl'); let dragging = false;
  c.addEventListener('pointerdown', (e) => { dragging = true; c.setPointerCapture(e.pointerId); touchAt(e, true); });
  c.addEventListener('pointermove', (e) => { if (dragging) touchAt(e, true); });
  const end = (e) => { dragging = false; touchAt(e, false); };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  c.style.touchAction = 'none';
}

async function start() {
  if (useGL) { document.getElementById('gl').style.display = 'block'; document.getElementById('pad').style.display = 'block'; document.getElementById('top').style.display = 'none'; document.getElementById('bottom').style.display = 'none'; }
  if (!Module._web_init(useGL ? 1 : 0, 400, 480)) { log('[FATAL] web_init failed', true); finish(); return; }
  const resp = await fetch(rom);
  if (!resp.ok) throw new Error('cannot fetch ' + rom + ': HTTP ' + resp.status);
  Module.FS.writeFile('/rom.3dsx', new Uint8Array(await resp.arrayBuffer()));
  // libctru's ndspInit() loads sdmc:/3ds/dspfirm.cdc (the console's DSP firmware, which we cannot ship). The HLE/Null DSP cores never parse it,
  // they only need the file to exist, so a zero-filled placeholder is enough. Panda3DS keeps per-game data in <SDL pref path>/<rom name>/ -> here /libsdl/Alber/rom/ (read from FS_DEBUG output on the iPhone).
  if (params.get('dsp') !== '0') { Module.FS.mkdirTree('/libsdl/Alber/rom/SDMC/3ds'); Module.FS.writeFile('/libsdl/Alber/rom/SDMC/3ds/dspfirm.cdc', new Uint8Array(262144)); }
  // extra files for the guest's SD card: sd=<url>@<path on the SD card>,... (e.g. a game's data files)
  for (const item of (params.get('sd') || '').split(',').filter(Boolean)) {
    const [url, dest] = item.split('@');
    const r = await fetch(url);
    if (!r.ok) { log('sd file ' + url + ': HTTP ' + r.status, true); continue; }
    const full = '/libsdl/Alber/rom/SDMC/' + dest, dir = full.slice(0, full.lastIndexOf('/'));
    Module.FS.mkdirTree(dir);
    Module.FS.writeFile(full, new Uint8Array(await r.arrayBuffer()));
    log('sd: ' + dest);
  }
  const ok = Module.ccall('web_load', 'number', ['string'], ['/rom.3dsx']);
  log('web_load ' + rom + ' -> ' + ok);
  post('loaded', { rom, ok, ...mem(), ua: navigator.userAgent });
  if (!ok) { finish(); return; }
  t0 = performance.now(); lastTick = t0;
  requestAnimationFrame(tick);
}

function runFrame() {
  const a = performance.now();
  const alive = Module._web_frame();
  const ms = performance.now() - a;
  frames++; sum += ms; if (ms > worst) worst = ms; if (ms > FRAME_MS) hitches++;
  if (dbg) post('frame', { n: frames, ms: +ms.toFixed(1), ...mem() });
  return alive;
}

function tick(now) {
  if (!running) return;
  let alive = 1, ran = 0;
  if (turbo) {
    for (; ran < 4 && alive && !(maxFrames && frames >= maxFrames); ran++) alive = runFrame();
  } else {
    acc += Math.min(now - lastTick, 100); lastTick = now;     // fixed time step: the display may refresh at 60 or 120 Hz
    while (acc >= FRAME_MS && ran < 3 && alive && !(maxFrames && frames >= maxFrames)) { alive = runFrame(); acc -= FRAME_MS; ran++; }
    if (acc > 2 * FRAME_MS) { late += Math.floor(acc / FRAME_MS); acc = 0; }   // emulation fell behind: drop the lag
  }
  if (ran) draw();
  if (now - lastBeat > 1000) {
    lastBeat = now;
    const st = `frame ${frames}  avg ${(sum / Math.max(frames, 1)).toFixed(2)} ms  worst ${worst.toFixed(0)} ms  late ${late}  ${mem().wasmMB} MB  (budget 16.7)`;
    document.getElementById('stats').textContent = st;
    post('tick', { frames, avgMs: sum / Math.max(frames, 1), worstMs: worst, late, hitches, ...mem(), fps: frames / ((performance.now() - t0) / 1000) });
  }
  if (!alive || (maxFrames && frames >= maxFrames)) { finish(); return; }
  requestAnimationFrame(tick);
}

// GL mode: count non-black pixels in the canvas halves (top screen = upper 240 rows, bottom screen = lower 240 rows)
function litGL() {
  const gl = document.getElementById('gl').getContext('webgl2');
  const w = 400, h = 480, d = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, d);
  let topLit = 0, bottomLit = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const i = (y * w + x) * 4; if (d[i] | d[i + 1] | d[i + 2]) { if (y >= 240) topLit++; else bottomLit++; } }   // GL rows run bottom to top
  return { topLit, bottomLit };
}

async function finish() {
  running = false;
  const lit = (c, w) => { const d = c.getImageData(0, 0, w, 240).data; let n = 0; for (let i = 0; i < d.length; i += 4) if (d[i] | d[i + 1] | d[i + 2]) n++; return n; };
  const wall = (performance.now() - t0) / 1000;
  const result = { rom, frames, avgMs: frames ? sum / frames : 0, worstMs: worst, late, hitches, fps: wall > 0 ? frames / wall : 0, wallSec: wall, ...mem(),
                   ...(useGL ? litGL() : { topLit: lit(ctx[0], 400), bottomLit: lit(ctx[1], 320) }), errors, userAgent: navigator.userAgent, turbo, done: true };
  if (useGL && report) { try { post('shot', { png: document.getElementById('gl').toDataURL('image/png') }); } catch (e) { log('shot failed: ' + e); } }
  document.getElementById('stats').textContent = `done: ${frames} frames, avg ${result.avgMs.toFixed(2)} ms, worst ${worst.toFixed(0)} ms, ${result.fps.toFixed(1)} fps, lit px top ${result.topLit} / bottom ${result.bottomLit}`;
  window.__result = result;
  if (report) {
    if (native) { post('done', result); return; }
    const png = await new Promise((r) => document.getElementById('top').toBlob(r, 'image/png'));
    await fetch('/report?name=' + encodeURIComponent(name), { method: 'POST', body: JSON.stringify(result) });
    await fetch('/report-png?name=' + encodeURIComponent(name), { method: 'POST', body: png });
  }
}
</script>
<script src="../build-core/AlberWeb.js"></script>
