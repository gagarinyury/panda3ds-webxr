async function loadRomBuffer(buf, filename) {
  const extMatch = filename.split('?')[0].split('#')[0].match(/\.([a-zA-Z0-9]+)$/);
  const ext = extMatch ? '.' + extMatch[1].toLowerCase() : '.3dsx';
  const guestPath = '/rom' + ext;
  document.getElementById('stats').textContent = `mounting ${filename} (${(buf.byteLength / 1048576).toFixed(1)} MB)...`;
  log(`loading ${filename} (${(buf.byteLength / 1048576).toFixed(1)} MB) as ${guestPath}...`);
  try { Module.FS.unlink(guestPath); } catch (e) {}
  Module.FS.writeFile(guestPath, new Uint8Array(buf));
  return bootRom(guestPath, filename);
}

  }

  log('web_load ' + filename + ' -> ' + ok);
  post('loaded', { rom: filename, ok, ...mem(), ua: navigator.userAgent });
  if (!ok) {
    log('[FATAL] web_load failed for ' + filename, true);
    finish();
    return;
  }

  running = true;
  t0 = performance.now(); lastTick = t0;

  for (const item of (params.get('script') || '').split(',').filter(Boolean)) { const [b, sec] = item.split('@'); setTimeout(() => { press(b, true); setTimeout(() => press(b, false), 250); }, +sec * 1000); }

async function loadRomUrl(url) {
  document.getElementById('stats').textContent = `fetching ${url}...`;
  const lazyParam = params.get('lazy');
  if (lazyParam !== '0') {   // images over 700 MB (and lazy=1) are read in pieces; the app serves HEAD and Range for Documents files too
    const head = await fetch(url, { method: 'HEAD' }).catch(() => null), headTotal = head && head.ok ? parseInt(head.headers.get('content-length') || '0') : 0;
    if (headTotal && (lazyParam === '1' || headTotal > 700 * 1048576)) return loadRomLazy(url, headTotal);
  }
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('cannot fetch ' + url + ': HTTP ' + resp.status);
  const total = parseInt(resp.headers.get('content-length') || '0');
  const extMatch = url.split('?')[0].split('#')[0].match(/\.([a-zA-Z0-9]+)$/);
  const guestPath = '/rom' + (extMatch ? '.' + extMatch[1].toLowerCase() : '.3dsx');
  if (total && resp.body) {
    // Stream straight into the emulator's in-memory file system. The whole file is allocated once up front (MEMFS would otherwise grow it in steps
    // and briefly hold several copies, which a 512 MB game cannot afford on a phone) and no list of chunks is kept.
    try { Module.FS.unlink(guestPath); } catch (e) {}

    }
    Module.FS.close(stream);
    log(`loaded ${url} (${(total / 1048576).toFixed(1)} MB) as ${guestPath}`);
    return bootRom(guestPath, url);
  }
  return loadRomBuffer(await resp.arrayBuffer(), url);
}

  if (fast()) {
    const tt0 = performance.now(); for (; ran < 16 && alive && !(maxFrames && frames >= maxFrames) && (ran === 0 || performance.now() - tt0 < 12); ran++) alive = runFrame();
    if (!fast()) { acc = 0; lastTick = performance.now(); }   // fast-forward is over: restart the real-time clock
  } else {
    acc += Math.min(now - lastTick, 100); lastTick = now;     // fixed time step: the display may refresh at 60 or 120 Hz
    // The browser may call us less often than 60 times a second (Comet on battery / low-power / occluded: ~30 per second, measured), so run as many
    // emulated frames as the elapsed time asks for, but never more than 3 and never once this tick has already used 10 ms (a spiral of death
    // when frames are expensive is what the old one-frame-per-tick cap was for; the time guard keeps that protection).
    const tickT0 = performance.now();
    while (acc >= FRAME_MS && alive && !(maxFrames && frames >= maxFrames) && ran < 3 && (ran === 0 || performance.now() - tickT0 < 10)) {
      alive = runFrame();
      acc -= FRAME_MS;
      ran++;
    }
    // Drop lag debt immediately when falling behind:
    if (acc > FRAME_MS) {
      late += Math.floor(acc / FRAME_MS);
      acc = 0;
    }
  }
  if (ran) draw();
  if (now - lastBeat > 1000) {
    lastBeat = now;
    const st = `frame ${frames}  avg ${(sum / Math.max(frames, 1)).toFixed(2)} ms  worst ${worst.toFixed(0)} ms  late ${late}  ${mem().wasmMB} MB  (budget 16.7)`;
    document.getElementById('stats').textContent = st;
    post('tick', { speed: +fpsNow.toFixed(1), loopHz: +rafHz.toFixed(0), paintHz: +presentHz.toFixed(0), tickMs: +tickMsAvg.toFixed(1), emuMs: +(frameMs.slice(-60).reduce((x, y) => x + y, 0) / Math.max(1, frameMs.slice(-60).length)).toFixed(1), frames, avgMs: sum / Math.max(frames, 1), worstMs: worst, late, hitches, ...(pingOn ? { pingOutMsS: pingStat.outMsS, pingOutMax: pingStat.outMax, pingInMsS: pingStat.inMsS, pingGapsS: pingStat.gaps } : {}), guestMsFr: jitStat.guestMsFr === null ? null : +jitStat.guestMsFr.toFixed(2), retFr: jitStat.retFr === null ? null : Math.round(jitStat.retFr), ticksFr: jitStat.ticksFr === null ? null : Math.round(jitStat.ticksFr), ...mem(), fps: frames / ((performance.now() - t0) / 1000) });
  }
  tickMsAvg = tickMsAvg * 0.95 + (performance.now() - tickStart) * 0.05; if (pingOn) tickSpans[tickSpans.length - 1][1] = performance.now();
  if (!alive || (maxFrames && frames >= maxFrames)) { finish(); return; }
  schedule();
}

// GL mode: count non-black pixels in the canvas halves (top screen = upper 240 rows, bottom screen = lower 240 rows)
function litGL() {
  const gl = document.getElementById('gl').getContext('webgl2');
  const w = GLW, h = GLH, d = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, d);
  let topLit = 0, bottomLit = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const i = (y * w + x) * 4; if (d[i] | d[i + 1] | d[i + 2]) { if (side ? x < 400 : y >= 240) topLit++; else bottomLit++; } }   // GL rows run bottom to top
  return { topLit, bottomLit };
}

async function finish() {
  running = false;
  const lit = (c, w) => { const d = c.getImageData(0, 0, w, 240).data; let n = 0; for (let i = 0; i < d.length; i += 4) if (d[i] | d[i + 1] | d[i + 2]) n++; return n; };
  const wall = (performance.now() - t0) / 1000;
  const result = { rom, frames, avgMs: frames ? sum / frames : 0, worstMs: worst, late, hitches, fps: wall > 0 ? frames / wall : 0, wallSec: wall, ...mem(),
                   ...(useGL ? litGL() : { topLit: lit(ctx[0], 400), bottomLit: lit(ctx[1], 320) }), errors, userAgent: navigator.userAgent, turbo, done: true };
  if (useGL && report) { try { post('shot', { png: document.getElementById('gl').toDataURL('image/png') }); } catch (e) { log('shot failed: ' + e); } }
  document.getElementById('stats').textContent = `done: ${frames} frames, avg ${result.avgMs.toFixed(2)} ms, worst ${worst.toFixed(0)} ms, ${result.fps.toFixed(1)} fps, lit px top ${result.topLit} / bottom ${result.bottomLit}`;
  window.__result = result;
  if (report) {
    if (native) { post('done', result); return; }
    const png = await new Promise((r) => document.getElementById(useGL ? 'gl' : 'top').toBlob(r, 'image/png'));
    await fetch('/report?name=' + encodeURIComponent(name), { method: 'POST', body: JSON.stringify(result) });
    await fetch('/report-png?name=' + encodeURIComponent(name), { method: 'POST', body: png });
  }
}
