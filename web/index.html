<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Panda3DS WebXR — Nintendo 3DS in Spatial 3D</title>
  <meta name="description" content="Play Nintendo 3DS games in real stereoscopic 3D on Meta Quest 3 and Apple Vision Pro with WebXR">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #0d0f15; color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    #ui-container {
      position: absolute; top: 0; left: 0; width: 100%;
      z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      height: 100%; padding: 16px;
    }
    .panel {
      pointer-events: auto;
      background: rgba(18, 22, 34, 0.75);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px; padding: 12px 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    header.panel {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem;
      letter-spacing: -0.02em; color: #fff;
    }
    .brand svg { width: 28px; height: 28px; fill: #48b0f7; }
    .status-badge {
      font-size: 0.8rem; font-weight: 600; padding: 4px 10px; border-radius: 20px;
      background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #2ecc71; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .controls-row {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    select, button, input[type="file"]::file-selector-button {
      background: #1f2538; color: #fff; border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px; padding: 8px 14px; font-size: 0.88rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s ease;
    }
    select:hover, button:hover { background: #2a334d; border-color: rgba(255, 255, 255, 0.3); }
    .btn-vr {
      background: linear-gradient(135deg, #0070f3, #00c6ff);
      border: none; color: #fff; font-weight: 600; padding: 9px 18px;
      border-radius: 10px; display: inline-flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 112, 243, 0.4);
    }
    .btn-vr:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0, 112, 243, 0.6); }

    .slider-box {
      display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #a1b0cb;
    }
    .slider-box input[type="range"] {
      width: 90px; accent-color: #0070f3; cursor: pointer;
    }

    footer.panel {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.82rem; color: #8899b5;
    }
    .keys-hint kbd {
      background: rgba(255, 255, 255, 0.1); border-radius: 4px; padding: 2px 6px;
      font-family: inherit; font-size: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.15);
    }

    #xrCanvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: block; z-index: 1;
    }
    #gl { display: none; } /* Hidden 800x480 offscreen emulator canvas */

    #loading-overlay {
      position: absolute; inset: 0; background: #0d0f15;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; z-index: 50; transition: opacity 0.4s ease;
    }
    .spinner {
      width: 44px; height: 44px; border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #0070f3; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Import maps polyfill for ES module support -->
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div style="font-weight: 500; color: #a1b0cb;">Loading Panda3DS WebAssembly Core...</div>
  </div>

  <div id="ui-container">
    <header class="panel">
      <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
        <span>Panda3DS WebXR</span>
      </div>

      <div class="controls-row">
        <select id="romSelect">
          <option value="run/examples/graphics__gpu__stereoscopic_2d.3dsx">Lenny 3D (Stereoscopic Demo)</option>
          <option value="run/examples/graphics__gpu__textured_cube.3dsx">Textured Cube 3D</option>
          <option value="run/examples/graphics__gpu__toon_shading.3dsx">Toon Shading 3D</option>
          <option value="run/examples/graphics__gpu__fragment_light.3dsx">Fragment Light 3D</option>
          <option value="run/ctr-hello.3dsx">CTR Hello World</option>
        </select>

        <label style="cursor: pointer;">
          <input type="file" id="romFileInput" accept=".3ds,.3dsx,.cia,.cxi,.app" style="display:none;">
          <button type="button" onclick="document.getElementById('romFileInput').click()">📁 Open ROM</button>
        </label>

        <div class="slider-box">
          <span>3D Depth:</span>
          <input type="range" id="depthSlider" min="0" max="1" step="0.05" value="1.0">
          <span id="depthVal">100%</span>
        </div>

        <button id="vrBtn" class="btn-vr">🥽 Enter VR</button>
      </div>

      <div class="status-badge">
        <div class="status-dot"></div>
        <span id="fpsBadge">60 FPS</span>
      </div>
    </header>

    <footer class="panel">
      <div class="keys-hint">
        🎮 <b>VR:</b> Thumbstick = Circle Pad | Trigger = Touch / L-R | A/B/X/Y Buttons &nbsp;|&nbsp;
        ⌨ <b>Desktop:</b> <kbd>WASD</kbd> Pad &nbsp;<kbd>Arrows</kbd> D-Pad &nbsp;<kbd>K</kbd>=A <kbd>J</kbd>=B <kbd>I</kbd>=X <kbd>U</kbd>=Y &nbsp;<kbd>Enter</kbd>=Start
      </div>
      <div>Panda3DS Core WebAssembly + WebGL2</div>
    </footer>
  </div>

  <canvas id="gl" width="800" height="480"></canvas>
  <canvas id="xrCanvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // -------------------------------------------------------------
    // Global State & 3DS Keys Bitmask
    // -------------------------------------------------------------
    const KEYS = {
      A: 1 << 0, B: 1 << 1, Select: 1 << 2, Start: 1 << 3,
      Right: 1 << 4, Left: 1 << 5, Up: 1 << 6, Down: 1 << 7,
      R: 1 << 8, L: 1 << 9, X: 1 << 10, Y: 1 << 11
    };

    let emuReady = false;
    let emuRunning = false;
    let currentRomName = '';
    let lastTime = performance.now();
    let frameCount = 0;
    let fps = 60;

    const glCanvas = document.getElementById('gl');
    const xrCanvas = document.getElementById('xrCanvas');

    // -------------------------------------------------------------
    // Three.js Scene & Stereoscopic WebXR Setup
    // -------------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({ canvas: xrCanvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0c12);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 50);
    camera.position.set(0, 1.35, 1.4);
    camera.layers.enable(1); // Left eye
    camera.layers.enable(2); // Right eye

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.25, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Ambient light
    const ambient = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambient);

    // -------------------------------------------------------------
    // Virtual 3DS Floating Console Meshes
    // -------------------------------------------------------------
    // Canvas texture sharing the offscreen WebGL2 canvas (800x480)
    const canvasTexture = new THREE.CanvasTexture(glCanvas);
    canvasTexture.minFilter = THREE.NearestFilter;
    canvasTexture.magFilter = THREE.NearestFilter;
    canvasTexture.generateMipmaps = false;

    // Top Left eye texture: UV [0.0..0.5, 0.5..1.0]
    const texLeft = canvasTexture.clone();
    texLeft.offset.set(0.0, 0.5);
    texLeft.repeat.set(0.5, 0.5);

    // Top Right eye texture: UV [0.5..1.0, 0.5..1.0]
    const texRight = canvasTexture.clone();
    texRight.offset.set(0.5, 0.5);
    texRight.repeat.set(0.5, 0.5);

    // Bottom screen texture: UV [0.3..0.7, 0.0..0.5] (centered horizontally: 320px in 800px)
    const texBottom = canvasTexture.clone();
    texBottom.offset.set(0.3, 0.0);
    texBottom.repeat.set(0.4, 0.5);

    const consoleGroup = new THREE.Group();
    consoleGroup.position.set(0, 1.2, 0); // At comfortable eye height
    scene.add(consoleGroup);

    // Frame styling (dark metallic 3DS housing)
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x181c26, roughness: 0.4, metalness: 0.6 });

    // Top Screen (Stereoscopic): Aspect ratio 400x240 -> 1.0m x 0.6m
    const topGeo = new THREE.PlaneGeometry(1.0, 0.6);
    const matTopLeft = new THREE.MeshBasicMaterial({ map: texLeft });
    const matTopRight = new THREE.MeshBasicMaterial({ map: texRight });

    const meshTopLeft = new THREE.Mesh(topGeo, matTopLeft);
    meshTopLeft.position.set(0, 0.35, 0);
    meshTopLeft.layers.set(1); // Visible ONLY to Left Eye in WebXR
    consoleGroup.add(meshTopLeft);

    const meshTopRight = new THREE.Mesh(topGeo, matTopRight);
    meshTopRight.position.set(0, 0.35, 0);
    meshTopRight.layers.set(2); // Visible ONLY to Right Eye in WebXR
    consoleGroup.add(meshTopRight);

    // Top Bezel frame
    const topBezel = new THREE.Mesh(new THREE.BoxGeometry(1.08, 0.68, 0.02), bodyMat);
    topBezel.position.set(0, 0.35, -0.012);
    topBezel.layers.set(0);
    consoleGroup.add(topBezel);

    // Bottom Screen (Touch): Aspect ratio 320x240 -> 0.8m x 0.6m
    const botGeo = new THREE.PlaneGeometry(0.8, 0.6);
    const matBottom = new THREE.MeshBasicMaterial({ map: texBottom });
    const meshBottom = new THREE.Mesh(botGeo, matBottom);
    meshBottom.position.set(0, -0.32, 0.08);
    meshBottom.rotation.x = -0.35; // Tilted upward toward player
    meshBottom.layers.set(0); // Visible to BOTH eyes
    consoleGroup.add(meshBottom);

    // Bottom Bezel frame
    const botBezel = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.68, 0.02), bodyMat);
    botBezel.position.set(0, -0.32, 0.07);
    botBezel.rotation.x = -0.35;
    botBezel.layers.set(0);
    consoleGroup.add(botBezel);

    // Touch Laser Pointer Indicator
    const dotGeo = new THREE.SphereGeometry(0.012, 16, 16);
    const dotMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    const touchDot = new THREE.Mesh(dotGeo, dotMat);
    touchDot.visible = false;
    scene.add(touchDot);

    // -------------------------------------------------------------
    // WebXR Controllers & Interaction
    // -------------------------------------------------------------
    const raycaster = new THREE.Raycaster();
    const tempMatrix = new THREE.Matrix4();

    const controller0 = renderer.xr.getController(0);
    scene.add(controller0);
    const controller1 = renderer.xr.getController(1);
    scene.add(controller1);

    // Controller laser line
    const laserMat = new THREE.LineBasicMaterial({ color: 0x00c6ff, transparent: true, opacity: 0.6 });
    const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -2)]);
    const laser0 = new THREE.Line(laserGeo, laserMat);
    controller0.add(laser0);
    const laser1 = new THREE.Line(laserGeo, laserMat);
    controller1.add(laser1);

    // -------------------------------------------------------------
    // Emscripten Module Definition
    // -------------------------------------------------------------
    window.Module = {
      canvas: glCanvas,
      locateFile: (path) => path.endsWith('.wasm') ? '../build-core/' + path : path,
      onRuntimeInitialized: async () => {
        console.log('[Panda3DS] WebAssembly runtime initialized');
        Module.FS.writeFile('/config.toml', `[GPU]\nRenderer = "opengl"\nScreenLayout = "Default"\nTopScreenSize = 0.5\nEnableShaderJIT = false\n[Audio]\nEnableAudio = true\nDSPEmulation = "HLE"\n`);
        
        // Initialize OpenGL ES on 800x480 canvas for Side-by-Side stereo
        if (!Module._web_init(1, 800, 480)) {
          alert('WebGL2 initialization failed inside emulator core');
          return;
        }

        // Set 3D depth to 1.0 (Full stereo)
        if (Module._web_set_3d_slider) {
          Module._web_set_3d_slider(1.0);
        }

        emuReady = true;
        document.getElementById('loading-overlay').style.opacity = '0';
        setTimeout(() => document.getElementById('loading-overlay').remove(), 400);

        // Auto-load default stereoscopic demo
        await loadRom(document.getElementById('romSelect').value);
      },
      print: (s) => console.log(s),
      printErr: (s) => console.error(s)
    };

    // -------------------------------------------------------------
    // ROM Loading Logic
    // -------------------------------------------------------------
    async function loadRom(pathOrUrl) {
      if (!emuReady) return;
      try {
        currentRomName = pathOrUrl.split('/').pop();
        console.log('[Panda3DS] Loading ROM:', currentRomName);
        const resp = await fetch(pathOrUrl);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const buf = await resp.arrayBuffer();
        Module.FS.writeFile('/' + currentRomName, new Uint8Array(buf));
        
        if (Module._web_load('/' + currentRomName)) {
          emuRunning = true;
          console.log('[Panda3DS] ROM loaded successfully!');
        } else {
          alert('Failed to load ROM: ' + currentRomName);
        }
      } catch (err) {
        console.error('[Panda3DS] Error loading ROM:', err);
      }
    }

    document.getElementById('romSelect').addEventListener('change', (e) => loadRom(e.target.value));

    document.getElementById('romFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const data = new Uint8Array(reader.result);
        const fname = file.name;
        Module.FS.writeFile('/' + fname, data);
        if (Module._web_load('/' + fname)) {
          emuRunning = true;
          currentRomName = fname;
          console.log('[Panda3DS] Custom ROM started:', fname);
        } else {
          alert('Failed to load custom ROM: ' + fname);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    // 3D Slider event
    const depthSlider = document.getElementById('depthSlider');
    const depthVal = document.getElementById('depthVal');
    depthSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      depthVal.textContent = Math.round(val * 100) + '%';
      if (Module._web_set_3d_slider) Module._web_set_3d_slider(val);
    });

    // -------------------------------------------------------------
    // WebXR Session Management
    // -------------------------------------------------------------
    const vrBtn = document.getElementById('vrBtn');
    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
        if (!supported) {
          vrBtn.textContent = '❌ WebXR not supported';
          vrBtn.disabled = true;
        }
      });
    } else {
      vrBtn.textContent = '❌ WebXR not available';
      vrBtn.disabled = true;
    }

    vrBtn.addEventListener('click', async () => {
      if (!navigator.xr) return;
      try {
        const session = await navigator.xr.requestSession('immersive-vr', {
          requiredFeatures: ['local-floor'],
          optionalFeatures: ['bounded-floor', 'hand-tracking']
        });
        renderer.xr.setSession(session);
        vrBtn.textContent = 'Exit VR';
        session.addEventListener('end', () => { vrBtn.textContent = '🥽 Enter VR'; });
      } catch (err) {
        console.error('[WebXR] Failed to start VR session:', err);
        alert('Could not start WebXR session: ' + err.message);
      }
    });

    // -------------------------------------------------------------
    // Desktop Touch Screen Interaction (Mouse click & drag)
    // -------------------------------------------------------------
    const mouse = new THREE.Vector2();
    let isMouseDown = false;

    function handleScreenTouch(clientX, clientY, down) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObject(meshBottom);
      if (hits.length > 0 && hits[0].uv) {
        const uv = hits[0].uv;
        const tx = Math.max(0, Math.min(319, Math.floor(uv.x * 320)));
        const ty = Math.max(0, Math.min(239, Math.floor((1.0 - uv.y) * 240)));
        if (Module._web_touch) Module._web_touch(tx, ty, down ? 1 : 0);
        touchDot.position.copy(hits[0].point);
        touchDot.visible = true;
      } else if (!down) {
        if (Module._web_touch) Module._web_touch(0, 0, 0);
        touchDot.visible = false;
      }
    }

    window.addEventListener('mousedown', (e) => { isMouseDown = true; handleScreenTouch(e.clientX, e.clientY, true); });
    window.addEventListener('mousemove', (e) => { if (isMouseDown) handleScreenTouch(e.clientX, e.clientY, true); });
    window.addEventListener('mouseup', () => { isMouseDown = false; handleScreenTouch(0, 0, false); });

    // -------------------------------------------------------------
    // Keyboard Controls Mapping
    // -------------------------------------------------------------
    const keyMap = {
      'KeyK': KEYS.A, 'KeyJ': KEYS.B, 'KeyI': KEYS.X, 'KeyU': KEYS.Y,
      'ArrowRight': KEYS.Right, 'ArrowLeft': KEYS.Left, 'ArrowUp': KEYS.Up, 'ArrowDown': KEYS.Down,
      'KeyQ': KEYS.L, 'KeyE': KEYS.R, 'Enter': KEYS.Start, 'Space': KEYS.Select
    };

    let circleX = 0, circleY = 0;
    window.addEventListener('keydown', (e) => {
      if (keyMap[e.code] && Module._web_key) Module._web_key(keyMap[e.code], 1);
      if (e.code === 'KeyD') circleX = 156;
      if (e.code === 'KeyA') circleX = -156;
      if (e.code === 'KeyW') circleY = 156;
      if (e.code === 'KeyS') circleY = -156;
      if (Module._web_circle) Module._web_circle(circleX, circleY);
    });
    window.addEventListener('keyup', (e) => {
      if (keyMap[e.code] && Module._web_key) Module._web_key(keyMap[e.code], 0);
      if (e.code === 'KeyD' || e.code === 'KeyA') circleX = 0;
      if (e.code === 'KeyW' || e.code === 'KeyS') circleY = 0;
      if (Module._web_circle) Module._web_circle(circleX, circleY);
    });

    // -------------------------------------------------------------
    // WebXR Controller Poll & Raycast Touch Loop
    // -------------------------------------------------------------
    function pollXRControllers() {
      const session = renderer.xr.getSession();
      if (!session) return;

      for (const source of session.inputSources) {
        if (!source.gamepad) continue;
        const gp = source.gamepad;
        const handedness = source.handedness;

        // Thumbstick -> 3DS Circle Pad
        if (gp.axes.length >= 4) {
          const stickX = Math.round(gp.axes[2] * 156);
          const stickY = Math.round(-gp.axes[3] * 156);
          if (Math.abs(stickX) > 20 || Math.abs(stickY) > 20) {
            Module._web_circle(stickX, stickY);
          } else if (handedness === 'left') {
            Module._web_circle(0, 0);
          }
        }

        // Face buttons & triggers
        if (handedness === 'right') {
          if (gp.buttons[4]) Module._web_key(KEYS.A, gp.buttons[4].pressed ? 1 : 0);
          if (gp.buttons[5]) Module._web_key(KEYS.B, gp.buttons[5].pressed ? 1 : 0);
          if (gp.buttons[1]) Module._web_key(KEYS.R, gp.buttons[1].pressed ? 1 : 0);
        } else if (handedness === 'left') {
          if (gp.buttons[4]) Module._web_key(KEYS.X, gp.buttons[4].pressed ? 1 : 0);
          if (gp.buttons[5]) Module._web_key(KEYS.Y, gp.buttons[5].pressed ? 1 : 0);
          if (gp.buttons[1]) Module._web_key(KEYS.L, gp.buttons[1].pressed ? 1 : 0);
        }
      }

      // Laser Raycast from Right Controller (1) to Bottom Screen
      tempMatrix.identity().extractRotation(controller1.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(controller1.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      const hits = raycaster.intersectObject(meshBottom);
      if (hits.length > 0 && hits[0].uv) {
        touchDot.position.copy(hits[0].point);
        touchDot.visible = true;

        const uv = hits[0].uv;
        const tx = Math.max(0, Math.min(319, Math.floor(uv.x * 320)));
        const ty = Math.max(0, Math.min(239, Math.floor((1.0 - uv.y) * 240)));

        const session = renderer.xr.getSession();
        const rSource = session.inputSources.find(s => s.handedness === 'right');
        const triggerPressed = rSource && rSource.gamepad && rSource.gamepad.buttons[0] && rSource.gamepad.buttons[0].pressed;
        if (Module._web_touch) Module._web_touch(tx, ty, triggerPressed ? 1 : 0);
      } else {
        touchDot.visible = false;
      }
    }

    // -------------------------------------------------------------
    // Main Render Loop
    // -------------------------------------------------------------
    renderer.setAnimationLoop(() => {
      // 1. Advance Panda3DS Emulator Frame
      if (emuReady && emuRunning) {
        Module._web_frame();
        canvasTexture.needsUpdate = true;
      }

      // 2. Poll WebXR Input if in VR session
      if (renderer.xr.isPresenting) {
        pollXRControllers();
      } else {
        controls.update();
      }

      // 3. Render Three.js Scene
      renderer.render(scene, camera);

      // 4. Update FPS Counter
      frameCount++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        fps = Math.round((frameCount * 1000) / (now - lastTime));
        document.getElementById('fpsBadge').textContent = `${fps} FPS`;
        frameCount = 0;
        lastTime = now;
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

  <!-- Load Panda3DS Core WebAssembly -->
  <script src="../build-core/AlberWeb.js"></script>
</body>
</html>
