<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Panda3DS WebXR — Nintendo 3DS in Spatial 3D</title>
  <meta name="description" content="Play Nintendo 3DS games in real stereoscopic 3D on Meta Quest 3 and Apple Vision Pro with WebXR">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #0d0f15; color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    #ui-container {
      position: absolute; top: 0; left: 0; width: 100%;
      z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      height: 100%; padding: 16px;
    }
    .panel {
      pointer-events: auto;
      background: rgba(18, 22, 34, 0.75);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px; padding: 12px 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    header.panel {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem;
      letter-spacing: -0.02em; color: #fff;
    }
    .brand svg { width: 28px; height: 28px; fill: #48b0f7; }
    .status-badge {
      font-size: 0.8rem; font-weight: 600; padding: 4px 10px; border-radius: 20px;
      background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #2ecc71; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .controls-row {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    select, button, input[type="file"]::file-selector-button {
      background: #1f2538; color: #fff; border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px; padding: 8px 14px; font-size: 0.88rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s ease;
    }
    select:hover, button:hover { background: #2a334d; border-color: rgba(255, 255, 255, 0.3); }
    .btn-vr {
      background: linear-gradient(135deg, #0070f3, #00c6ff);
      border: none; color: #fff; font-weight: 600; padding: 9px 18px;
      border-radius: 10px; display: inline-flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 112, 243, 0.4);
    }
    .btn-vr:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0, 112, 243, 0.6); }

    .slider-box {
      display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #a1b0cb;
    }
    .slider-box input[type="range"] {
      width: 90px; accent-color: #0070f3; cursor: pointer;
    }

    footer.panel {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.82rem; color: #8899b5;
    }
    .keys-hint kbd {
      background: rgba(255, 255, 255, 0.1); border-radius: 4px; padding: 2px 6px;
      font-family: inherit; font-size: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.15);
    }

    #xrCanvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: block; z-index: 1;
    }
    #gl {
      position: fixed;
      left: -9999px;
      top: -9999px;
      width: 800px;
      height: 480px;
      opacity: 0;
      pointer-events: none;
      z-index: -10;
    }

    #loading-overlay {
      position: absolute; inset: 0; background: #0d0f15;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; z-index: 50; transition: opacity 0.4s ease;
    }
    .spinner {
      width: 44px; height: 44px; border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #0070f3; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Import maps polyfill for ES module support -->
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div style="font-weight: 500; color: #a1b0cb;">Loading Panda3DS WebAssembly Core...</div>
  </div>

  <div id="ui-container">
    <header class="panel">
      <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
        <span>Panda3DS WebXR</span>
      </div>

      <div class="controls-row">
        <select id="romSelect">
          <option value="run/examples/graphics__gpu__lenny.3dsx">🌟 Lenny 3D (Rotating 3D Model)</option>
          <option value="run/sm3dl.3ds">🍄 Super Mario 3D Land (Full Commercial 3D Game)</option>
          <option value="run/examples/graphics__gpu__stereoscopic_2d.3dsx">🕶️ Lenny 2D (Parallax Test)</option>
          <option value="run/examples/graphics__gpu__textured_cube.3dsx">🧊 Textured Cube 3D</option>
          <option value="run/examples/graphics__gpu__toon_shading.3dsx">🎨 Toon Shading 3D</option>
          <option value="run/examples/graphics__gpu__fragment_light.3dsx">💡 Fragment Light 3D</option>
          <option value="run/ctr-hello.3dsx">📜 CTR Hello World</option>
        </select>

        <label style="cursor: pointer;">
          <input type="file" id="romFileInput" accept=".3ds,.3dsx,.cia,.cxi,.app" style="display:none;">
          <button type="button" onclick="document.getElementById('romFileInput').click()">📁 Open ROM</button>
        </label>

        <div class="slider-box">
          <span>3D Depth:</span>
          <input type="range" id="depthSlider" min="0" max="1" step="0.05" value="1.0">
          <span id="depthVal">100%</span>
        </div>

        <button id="vrBtn" class="btn-vr">🥽 Enter VR</button>
      </div>

      <div class="status-badge">
        <div class="status-dot"></div>
        <span id="fpsBadge">60 FPS</span>
      </div>
    </header>

    <footer class="panel">
      <div class="keys-hint">
        🎮 <b>VR:</b> Thumbstick = Circle Pad | Trigger = Touch / L-R | A/B/X/Y Buttons &nbsp;|&nbsp;
        ⌨ <b>Desktop:</b> <kbd>WASD</kbd> Pad &nbsp;<kbd>Arrows</kbd> D-Pad &nbsp;<kbd>K</kbd>=A <kbd>J</kbd>=B <kbd>I</kbd>=X <kbd>U</kbd>=Y &nbsp;<kbd>Enter</kbd>=Start
      </div>
      <div>Panda3DS Core WebAssembly + WebGL2</div>
    </footer>
  </div>

  <canvas id="gl" width="800" height="480"></canvas>
  <canvas id="xrCanvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // -------------------------------------------------------------
    // Global State & 3DS Keys Bitmask
    // -------------------------------------------------------------
    const KEYS = {
      A: 1 << 0, B: 1 << 1, Select: 1 << 2, Start: 1 << 3,
      Right: 1 << 4, Left: 1 << 5, Up: 1 << 6, Down: 1 << 7,
      R: 1 << 8, L: 1 << 9, X: 1 << 10, Y: 1 << 11
    };

    let emuReady = false;
    let emuRunning = false;
    let currentRomName = '';
    let lastTime = performance.now();
    let frameCount = 0;
    let fps = 60;

    const glCanvas = document.getElementById('gl');
    const xrCanvas = document.getElementById('xrCanvas');

    // -------------------------------------------------------------
    // Three.js Scene & Stereoscopic WebXR Setup
    // -------------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({ canvas: xrCanvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0c12);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 50);
    camera.position.set(0, 1.05, 0.4);
    camera.layers.enable(1); // On desktop flat screen, view Left eye by default

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.05, -1.45);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Ambient light
    const ambient = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambient);

    // -------------------------------------------------------------
    // Virtual 3DS Floating Console Meshes
    // -------------------------------------------------------------
    const texLeft = new THREE.CanvasTexture(glCanvas);
    texLeft.minFilter = THREE.NearestFilter;
    texLeft.magFilter = THREE.NearestFilter;
    texLeft.generateMipmaps = false;
    texLeft.offset.set(0.0, 0.5);
    texLeft.repeat.set(0.5, 0.5);

    const texRight = new THREE.CanvasTexture(glCanvas);
    texRight.minFilter = THREE.NearestFilter;
    texRight.magFilter = THREE.NearestFilter;
    texRight.generateMipmaps = false;
    texRight.offset.set(0.5, 0.5);
    texRight.repeat.set(0.5, 0.5);

    const texBottom = new THREE.CanvasTexture(glCanvas);
    texBottom.minFilter = THREE.NearestFilter;
    texBottom.magFilter = THREE.NearestFilter;
    texBottom.generateMipmaps = false;
    texBottom.offset.set(0.3, 0.0);
    texBottom.repeat.set(0.4, 0.5);

    const consoleGroup = new THREE.Group();
    consoleGroup.position.set(0, 0.45, -1.45); // Lowered by ~0.9m as requested for comfortable eye-level VR
    consoleGroup.scale.set(1.7, 1.7, 1.7);     // Large immersive screens in VR
    scene.add(consoleGroup);

    // Frame styling (dark metallic 3DS housing)
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x181c26, roughness: 0.4, metalness: 0.6 });

    // Top Screen (Stereoscopic): Aspect ratio 400x240 -> 1.0m x 0.6m
    const topGeo = new THREE.PlaneGeometry(1.0, 0.6);
    const matTopLeft = new THREE.MeshBasicMaterial({ map: texLeft });
    const matTopRight = new THREE.MeshBasicMaterial({ map: texRight });

    const meshTopLeft = new THREE.Mesh(topGeo, matTopLeft);
    meshTopLeft.position.set(0, 0.35, 0);
    meshTopLeft.layers.set(1); // Visible ONLY to Left Eye in WebXR
    consoleGroup.add(meshTopLeft);

    const meshTopRight = new THREE.Mesh(topGeo, matTopRight);
    meshTopRight.position.set(0, 0.35, 0);
    meshTopRight.layers.set(2); // Visible ONLY to Right Eye in WebXR
    consoleGroup.add(meshTopRight);

    // Top Bezel frame
    const topBezel = new THREE.Mesh(new THREE.BoxGeometry(1.08, 0.68, 0.02), bodyMat);
    topBezel.position.set(0, 0.35, -0.012);
    topBezel.layers.set(0);
    consoleGroup.add(topBezel);

    // Bottom Screen (Touch): Aspect ratio 320x240 -> 0.8m x 0.6m
    const botGeo = new THREE.PlaneGeometry(0.8, 0.6);
    const matBottom = new THREE.MeshBasicMaterial({ map: texBottom });
    const meshBottom = new THREE.Mesh(botGeo, matBottom);
    meshBottom.position.set(0, -0.32, 0.08);
    meshBottom.rotation.x = -0.35; // Tilted upward toward player
    meshBottom.layers.set(0); // Visible to BOTH eyes via layer 0
    consoleGroup.add(meshBottom);

    // Bottom Bezel frame
    const botBezel = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.68, 0.02), bodyMat);
    botBezel.position.set(0, -0.32, 0.07);
    botBezel.rotation.x = -0.35;
    botBezel.layers.set(0);
    consoleGroup.add(botBezel);

    // -------------------------------------------------------------
    // In-XR Spatial 3D Control Panels (Top Bar, Side Panel, Bottom Bar)
    // -------------------------------------------------------------
    const ROM_LIST = [
      { name: '🌟 Lenny 3D', path: 'run/examples/graphics__gpu__lenny.3dsx' },
      { name: '🍄 Mario 3D Land', path: 'run/sm3dl.3ds' },
      { name: '🕶️ Stereo 2D', path: 'run/examples/graphics__gpu__stereoscopic_2d.3dsx' },
      { name: '🧊 Text. Cube', path: 'run/examples/graphics__gpu__textured_cube.3dsx' },
      { name: '🎨 Toon Shader', path: 'run/examples/graphics__gpu__toon_shading.3dsx' },
      { name: '💡 Frag. Light', path: 'run/examples/graphics__gpu__fragment_light.3dsx' },
      { name: '📜 CTR Hello', path: 'run/ctr-hello.3dsx' }
    ];
    let currentRomIndex = 0;
    let current3DDepth = 1.0;

    const uiButtons = [];
    let romButtonMeshes = [];
    let marioTopBtn = null;
    let depthTopBtn = null;

    function makeButton(text, w, h, x, y, bgColor, onClick, parentGroup, strokeColor = null) {
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w * 1024);
      canvas.height = Math.round(h * 1024);
      const ctx = canvas.getContext('2d');
      const tex = new THREE.CanvasTexture(canvas);

      let currentText = text;
      let isCurrentHover = false;
      let isCurrentActive = false;

      function draw(isHover = isCurrentHover, isActive = isCurrentActive) {
        isCurrentHover = isHover;
        isCurrentActive = isActive;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = isActive ? '#0284c7' : (isHover ? '#334155' : bgColor);
        ctx.beginPath();
        ctx.roundRect(10, 10, canvas.width - 20, canvas.height - 20, 24);
        ctx.fill();
        ctx.lineWidth = 10;
        ctx.strokeStyle = isActive ? '#38bdf8' : (isHover ? '#00f2fe' : (strokeColor || (bgColor === '#dc2626' ? '#ef4444' : '#64748b')));
        ctx.stroke();

        ctx.font = 'bold ' + Math.round(canvas.height * 0.42) + 'px system-ui, -apple-system, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(currentText, canvas.width / 2, canvas.height / 2);
        tex.needsUpdate = true;
      }

      draw();

      const btnGeo = new THREE.PlaneGeometry(w, h);
      const btnMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
      const btnMesh = new THREE.Mesh(btnGeo, btnMat);
      btnMesh.position.set(x, y, 0.014);
      btnMesh.layers.set(0);
      parentGroup.add(btnMesh);

      btnMesh.userData = {
        onClick,
        draw,
        setHover: (h) => draw(h, isCurrentActive),
        setActive: (a) => draw(isCurrentHover, a),
        setText: (t) => { currentText = t; draw(); },
        getText: () => currentText
      };
      uiButtons.push(btnMesh);
      return btnMesh;
    }

    function updateRomButtonHighlights() {
      romButtonMeshes.forEach((btn, i) => {
        btn.userData.setActive(i === currentRomIndex);
      });
    }

    function updateDepthDisplay() {
      const pct = Math.round(current3DDepth * 100) + '%';
      if (depthTopBtn) depthTopBtn.userData.setText(`3D: ${pct}`);
      if (depthSlider) depthSlider.value = current3DDepth;
      if (depthVal) depthVal.textContent = pct;
      if (Module._web_set_3d_slider) Module._web_set_3d_slider(current3DDepth);
    }

    // --- 1. TOP BAR FLOATING HUD (Directly above Top Screen) ---
    const topBarGroup = new THREE.Group();
    topBarGroup.position.set(0, 0.76, 0.02);
    consoleGroup.add(topBarGroup);

    const topBarBack = new THREE.Mesh(
      new THREE.BoxGeometry(1.10, 0.14, 0.02),
      new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5, metalness: 0.5 })
    );
    topBarBack.layers.set(0);
    topBarGroup.add(topBarBack);

    // [ ✕ EXIT VR ] - Big Red Button
    makeButton('✕ EXIT VR', 0.28, 0.095, -0.36, 0, '#dc2626', async () => {
      if (renderer.xr.isPresenting) {
        try { await renderer.xr.getSession().end(); } catch (e) {}
      }
    }, topBarGroup, '#ef4444');

    // [ 🍄 Mario 3D Land ] - Quick Launch Button
    marioTopBtn = makeButton('🍄 Mario 3D Land', 0.44, 0.095, 0.04, 0, '#d97706', () => {
      loadRom('run/sm3dl.3ds');
    }, topBarGroup, '#fbbf24');

    // [ 3D: 100% ] - Depth Toggle
    depthTopBtn = makeButton('3D: 100%', 0.24, 0.095, 0.42, 0, '#0f766e', () => {
      current3DDepth = (current3DDepth <= 0.05) ? 1.0 : +(current3DDepth - 0.25).toFixed(2);
      updateDepthDisplay();
    }, topBarGroup, '#2dd4bf');

    // --- 2. SIDE WING PANEL (Right Side of Top Screen, Angled toward User) ---
    const sideBarGroup = new THREE.Group();
    sideBarGroup.position.set(0.74, 0.35, 0.06);
    sideBarGroup.rotation.y = -0.32;
    consoleGroup.add(sideBarGroup);

    const sideBarBack = new THREE.Mesh(
      new THREE.BoxGeometry(0.38, 0.74, 0.02),
      new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5, metalness: 0.5 })
    );
    sideBarBack.layers.set(0);
    sideBarGroup.add(sideBarBack);

    // List all ROMs on Side Panel
    ROM_LIST.forEach((rom, i) => {
      const yPos = 0.27 - i * 0.076;
      const btn = makeButton(rom.name, 0.34, 0.066, 0, yPos, '#1e293b', () => {
        loadRom(rom.path);
      }, sideBarGroup);
      romButtonMeshes.push(btn);
    });

    // Exit VR button on Side Panel
    makeButton('✕ Exit VR', 0.34, 0.066, 0, -0.29, '#dc2626', async () => {
      if (renderer.xr.isPresenting) {
        try { await renderer.xr.getSession().end(); } catch (e) {}
      }
    }, sideBarGroup, '#ef4444');

    // --- 3. BOTTOM PANEL (Underneath Bottom Touch Screen) ---
    const uiGroup = new THREE.Group();
    uiGroup.position.set(0, -0.68, 0.16);
    uiGroup.rotation.x = -0.35;
    consoleGroup.add(uiGroup);

    const uiBackMesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.90, 0.14, 0.02),
      new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5, metalness: 0.5 })
    );
    uiBackMesh.layers.set(0);
    uiGroup.add(uiBackMesh);

    makeButton('◀ Prev ROM', 0.27, 0.09, -0.30, 0, '#1e293b', () => {
      currentRomIndex = (currentRomIndex - 1 + ROM_LIST.length) % ROM_LIST.length;
      loadRom(ROM_LIST[currentRomIndex].path);
    }, uiGroup);

    makeButton('Next ROM ▶', 0.27, 0.09, 0.0, 0, '#1e293b', () => {
      currentRomIndex = (currentRomIndex + 1) % ROM_LIST.length;
      loadRom(ROM_LIST[currentRomIndex].path);
    }, uiGroup);

    makeButton('✕ Exit VR', 0.27, 0.09, 0.30, 0, '#dc2626', async () => {
      if (renderer.xr.isPresenting) {
        try { await renderer.xr.getSession().end(); } catch (e) {}
      }
    }, uiGroup, '#ef4444');

    // Touch Laser Pointer Indicator
    const dotGeo = new THREE.SphereGeometry(0.012, 16, 16);
    const dotMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    const touchDot = new THREE.Mesh(dotGeo, dotMat);
    touchDot.layers.set(0);
    touchDot.visible = false;
    scene.add(touchDot);

    // -------------------------------------------------------------
    // WebXR Controllers & Interaction Setup
    // -------------------------------------------------------------
    const raycaster = new THREE.Raycaster();
    const tempMatrix = new THREE.Matrix4();

    function setupXRController(ctrl) {
      ctrl.layers.set(0);
      scene.add(ctrl);

      const laserMat = new THREE.LineBasicMaterial({ color: 0x00c6ff, transparent: true, opacity: 0.65 });
      const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -2.5)]);
      const laser = new THREE.Line(laserGeo, laserMat);
      laser.layers.set(0);
      ctrl.add(laser);

      // Trigger click via WebXR select event
      ctrl.addEventListener('select', () => {
        tempMatrix.identity().extractRotation(ctrl.matrixWorld);
        raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
        const hits = raycaster.intersectObjects(uiButtons);
        if (hits.length > 0 && hits[0].object.userData && hits[0].object.userData.onClick) {
          hits[0].object.userData.onClick();
        }
      });
      return ctrl;
    }

    const controller0 = setupXRController(renderer.xr.getController(0));
    const controller1 = setupXRController(renderer.xr.getController(1));

    // -------------------------------------------------------------
    // Emscripten Module Definition
    // -------------------------------------------------------------
    window.Module = {
      canvas: glCanvas,
      locateFile: (path) => path.endsWith('.wasm') ? '../build-core/' + path : path,
      onRuntimeInitialized: async () => {
        console.log('[Panda3DS] WebAssembly runtime initialized');
        Module.FS.writeFile('/config.toml', `[GPU]\nRenderer = "opengl"\nScreenLayout = "Default"\nTopScreenSize = 0.5\nEnableShaderJIT = false\n[Audio]\nEnableAudio = true\nDSPEmulation = "HLE"\n`);
        
        // Initialize OpenGL ES on 800x480 canvas for Side-by-Side stereo
        if (!Module._web_init(1, 800, 480)) {
          alert('WebGL2 initialization failed inside emulator core');
          return;
        }

        // Set 3D depth to 1.0 (Full stereo)
        if (Module._web_set_3d_slider) {
          Module._web_set_3d_slider(1.0);
        }

        emuReady = true;
        document.getElementById('loading-overlay').style.opacity = '0';
        setTimeout(() => document.getElementById('loading-overlay').remove(), 400);

        // Auto-load default stereoscopic demo (or URL query param)
        const params = new URLSearchParams(window.location.search);
        const startRom = params.get('rom') || document.getElementById('romSelect').value;
        await loadRom(startRom);
      },
      print: (s) => console.log(s),
      printErr: (s) => console.error(s)
    };

    // Dynamically inject AlberWeb.js so window.Module is guaranteed to exist
    const coreScript = document.createElement('script');
    coreScript.src = '../build-core/AlberWeb.js';
    document.body.appendChild(coreScript);

    // -------------------------------------------------------------
    // ROM Loading Logic with Live Streaming Progress & Memory Management
    // -------------------------------------------------------------
    function setRomLoadingStatus(pathOrUrl, status) {
      const idx = ROM_LIST.findIndex(r => r.path === pathOrUrl || pathOrUrl.endsWith(r.path.split('/').pop()));
      if (idx !== -1 && romButtonMeshes[idx]) {
        romButtonMeshes[idx].userData.setText(status);
      }
      if (marioTopBtn && (pathOrUrl.includes('sm3dl') || idx === 1)) {
        marioTopBtn.userData.setText(status);
      }
      const st = document.getElementById('status');
      if (st) st.textContent = status;
    }

    function restoreRomLabels() {
      ROM_LIST.forEach((rom, i) => {
        if (romButtonMeshes[i]) romButtonMeshes[i].userData.setText(rom.name);
      });
      if (marioTopBtn) marioTopBtn.userData.setText('🍄 Mario 3D Land');
      const st = document.getElementById('status');
      if (st) st.textContent = 'Running: ' + currentRomName;
    }

    async function loadRom(pathOrUrl) {
      if (!emuReady) return;
      emuRunning = false; // Pause emulator frames while switching ROM
      try {
        currentRomName = pathOrUrl.split('/').pop();
        console.log('[Panda3DS] Loading ROM:', currentRomName);

        // Sync with ROM_LIST
        const idx = ROM_LIST.findIndex(r => r.path === pathOrUrl || pathOrUrl.endsWith(r.path.split('/').pop()));
        if (idx !== -1) {
          currentRomIndex = idx;
          updateRomButtonHighlights();
        }
        const selectEl = document.getElementById('romSelect');
        if (selectEl) selectEl.value = pathOrUrl;

        setRomLoadingStatus(pathOrUrl, '⏳ Fetching...');

        const resp = await fetch(pathOrUrl);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

        const contentLength = resp.headers.get('content-length');
        const totalBytes = contentLength ? parseInt(contentLength, 10) : 0;
        let buf;

        if (totalBytes > 5 * 1024 * 1024 && resp.body) {
          const reader = resp.body.getReader();
          const chunks = [];
          let receivedBytes = 0;
          let lastUpdate = 0;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            receivedBytes += value.length;
            const now = Date.now();
            if (now - lastUpdate > 150 || receivedBytes === totalBytes) {
              lastUpdate = now;
              const pct = Math.round((receivedBytes / totalBytes) * 100);
              const mb = (receivedBytes / (1024 * 1024)).toFixed(0);
              setRomLoadingStatus(pathOrUrl, `⏳ ${pct}% (${mb}MB)`);
            }
          }
          const allChunks = new Uint8Array(receivedBytes);
          let position = 0;
          for (const chunk of chunks) {
            allChunks.set(chunk, position);
            position += chunk.length;
          }
          buf = allChunks.buffer;
        } else {
          buf = await resp.arrayBuffer();
        }

        setRomLoadingStatus(pathOrUrl, '⚙️ Booting...');

        const romPath = '/' + currentRomName;
        // Clean up previous ROM from MEMFS to keep memory free
        if (window.__lastRomPath && window.__lastRomPath !== romPath) {
          try { Module.FS.unlink(window.__lastRomPath); } catch (e) {}
        }
        window.__lastRomPath = romPath;

        Module.FS.writeFile(romPath, new Uint8Array(buf));
        
        const ok = Module.ccall ? Module.ccall('web_load', 'number', ['string'], [romPath]) : Module._web_load(romPath);
        if (ok) {
          emuRunning = true;
          console.log('[Panda3DS] ROM loaded successfully:', currentRomName);
          restoreRomLabels();
        } else {
          console.error('Failed to load ROM: ' + currentRomName);
          setRomLoadingStatus(pathOrUrl, '❌ Error');
          setTimeout(restoreRomLabels, 3000);
          alert('Failed to load ROM: ' + currentRomName);
        }
      } catch (err) {
        console.error('[Panda3DS] Error loading ROM:', err);
        setRomLoadingStatus(pathOrUrl, '❌ Failed');
        setTimeout(restoreRomLabels, 3000);
      }
    }

    document.getElementById('romSelect').addEventListener('change', (e) => loadRom(e.target.value));

    document.getElementById('romFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      emuRunning = false;
      const reader = new FileReader();
      reader.onload = () => {
        const data = new Uint8Array(reader.result);
        const fname = file.name;
        const romPath = '/' + fname;
        Module.FS.writeFile(romPath, data);
        const ok = Module.ccall ? Module.ccall('web_load', 'number', ['string'], [romPath]) : Module._web_load(romPath);
        if (ok) {
          emuRunning = true;
          currentRomName = fname;
          console.log('[Panda3DS] Custom ROM started:', fname);
        } else {
          alert('Failed to load custom ROM: ' + fname);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    // 3D Slider event
    const depthSlider = document.getElementById('depthSlider');
    const depthVal = document.getElementById('depthVal');
    depthSlider.addEventListener('input', (e) => {
      current3DDepth = parseFloat(e.target.value);
      updateDepthDisplay();
    });

    // -------------------------------------------------------------
    // WebXR Session Management
    // -------------------------------------------------------------
    const vrBtn = document.getElementById('vrBtn');
    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
        if (!supported) {
          vrBtn.textContent = '❌ WebXR not supported';
          vrBtn.disabled = true;
        }
      });
    } else {
      vrBtn.textContent = '❌ WebXR not available';
      vrBtn.disabled = true;
    }

    vrBtn.addEventListener('click', async () => {
      if (!navigator.xr) return;
      if (renderer.xr.isPresenting) {
        try {
          await renderer.xr.getSession().end();
        } catch (e) {}
        return;
      }
      try {
        const session = await navigator.xr.requestSession('immersive-vr', {
          requiredFeatures: ['local-floor'],
          optionalFeatures: ['bounded-floor', 'hand-tracking']
        });
        await renderer.xr.setSession(session);
        vrBtn.textContent = '✕ Exit VR';
        camera.layers.set(0); // In VR, parent camera only holds layer 0
        session.addEventListener('end', () => {
          vrBtn.textContent = '🥽 Enter VR';
          camera.layers.set(0);
          camera.layers.enable(1); // Restore Left Eye view on desktop flat screen
          camera.position.set(0, 1.05, 0.4);
          controls.target.set(0, 1.05, -1.45);
          controls.update();
        });
      } catch (err) {
        console.error('[WebXR] Failed to start VR session:', err);
        alert('Could not start WebXR session: ' + err.message);
      }
    });

    // -------------------------------------------------------------
    // Desktop Touch Screen Interaction (Mouse click & drag)
    // -------------------------------------------------------------
    const mouse = new THREE.Vector2();
    let isMouseDown = false;

    function handleScreenTouch(clientX, clientY, down) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObject(meshBottom);
      if (hits.length > 0 && hits[0].uv) {
        const uv = hits[0].uv;
        const tx = Math.max(0, Math.min(319, Math.floor(uv.x * 320)));
        const ty = Math.max(0, Math.min(239, Math.floor((1.0 - uv.y) * 240)));
        if (Module._web_touch) Module._web_touch(tx, ty, down ? 1 : 0);
        touchDot.position.copy(hits[0].point);
        touchDot.visible = true;
      } else if (!down) {
        if (Module._web_touch) Module._web_touch(0, 0, 0);
        touchDot.visible = false;
      }
    }

    window.addEventListener('mousedown', (e) => { isMouseDown = true; handleScreenTouch(e.clientX, e.clientY, true); });
    window.addEventListener('mousemove', (e) => { if (isMouseDown) handleScreenTouch(e.clientX, e.clientY, true); });
    window.addEventListener('mouseup', () => { isMouseDown = false; handleScreenTouch(0, 0, false); });

    // -------------------------------------------------------------
    // Keyboard Controls Mapping
    // -------------------------------------------------------------
    const keyMap = {
      'KeyK': KEYS.A, 'KeyJ': KEYS.B, 'KeyI': KEYS.X, 'KeyU': KEYS.Y,
      'ArrowRight': KEYS.Right, 'ArrowLeft': KEYS.Left, 'ArrowUp': KEYS.Up, 'ArrowDown': KEYS.Down,
      'KeyQ': KEYS.L, 'KeyE': KEYS.R, 'Enter': KEYS.Start, 'Space': KEYS.Select
    };

    let circleX = 0, circleY = 0;
    window.addEventListener('keydown', (e) => {
      if (keyMap[e.code] && Module._web_key) Module._web_key(keyMap[e.code], 1);
      if (e.code === 'KeyD') circleX = 156;
      if (e.code === 'KeyA') circleX = -156;
      if (e.code === 'KeyW') circleY = 156;
      if (e.code === 'KeyS') circleY = -156;
      if (Module._web_circle) Module._web_circle(circleX, circleY);
    });
    window.addEventListener('keyup', (e) => {
      if (keyMap[e.code] && Module._web_key) Module._web_key(keyMap[e.code], 0);
      if (e.code === 'KeyD' || e.code === 'KeyA') circleX = 0;
      if (e.code === 'KeyW' || e.code === 'KeyS') circleY = 0;
      if (Module._web_circle) Module._web_circle(circleX, circleY);
    });

    // -------------------------------------------------------------
    // WebXR Controller Poll & Raycast Interaction Loop
    // -------------------------------------------------------------
    let gripRDown = false;
    let gripLDown = false;
    let wasTriggerPressed = false;
    let lastHoveredBtn = null;

    function pollXRControllers() {
      const session = renderer.xr.getSession();
      if (!session) return;

      const sources = Array.from(session.inputSources || []);
      for (const source of sources) {
        if (!source.gamepad) continue;
        const gp = source.gamepad;
        const handedness = source.handedness;

        // Thumbstick -> 3DS Circle Pad
        if (gp.axes && gp.axes.length >= 2) {
          const ax = gp.axes.length >= 4 ? gp.axes[2] : gp.axes[0];
          const ay = gp.axes.length >= 4 ? gp.axes[3] : gp.axes[1];
          const stickX = Math.round(ax * 156);
          const stickY = Math.round(-ay * 156);
          if (Module && Module._web_circle) {
            if (Math.abs(stickX) > 20 || Math.abs(stickY) > 20) {
              Module._web_circle(stickX, stickY);
            } else if (handedness === 'left') {
              Module._web_circle(0, 0);
            }
          }
        }

        // Grip / Squeeze -> Cycle ROMs!
        if (gp.buttons && gp.buttons.length > 1 && gp.buttons[1]) {
          if (handedness === 'right') {
            if (gp.buttons[1].pressed && !gripRDown) {
              gripRDown = true;
              currentRomIndex = (currentRomIndex + 1) % ROM_LIST.length;
              loadRom(ROM_LIST[currentRomIndex].path);
            } else if (!gp.buttons[1].pressed) {
              gripRDown = false;
            }
          } else if (handedness === 'left') {
            if (gp.buttons[1].pressed && !gripLDown) {
              gripLDown = true;
              currentRomIndex = (currentRomIndex - 1 + ROM_LIST.length) % ROM_LIST.length;
              loadRom(ROM_LIST[currentRomIndex].path);
            } else if (!gp.buttons[1].pressed) {
              gripLDown = false;
            }
          }
        }

        // Face buttons & triggers
        if (Module && Module._web_key) {
          if (handedness === 'right') {
            if (gp.buttons[4]) Module._web_key(KEYS.A, gp.buttons[4].pressed ? 1 : 0);
            if (gp.buttons[5]) Module._web_key(KEYS.B, gp.buttons[5].pressed ? 1 : 0);
            if (gp.buttons[0]) Module._web_key(KEYS.R, gp.buttons[0].pressed ? 1 : 0);
          } else if (handedness === 'left') {
            if (gp.buttons[4]) Module._web_key(KEYS.X, gp.buttons[4].pressed ? 1 : 0);
            if (gp.buttons[5]) Module._web_key(KEYS.Y, gp.buttons[5].pressed ? 1 : 0);
            if (gp.buttons[0]) Module._web_key(KEYS.L, gp.buttons[0].pressed ? 1 : 0);
          }
        }
      }

      // Laser Raycast from Active Controllers to 3D UI Buttons & Bottom Screen
      const activeControllers = [
        { ctrl: controller1, src: sources.find(s => s.handedness === 'right') || sources[1] },
        { ctrl: controller0, src: sources.find(s => s.handedness === 'left') || sources[0] }
      ];

      let anyHit = false;
      let primaryTriggerPressed = false;

      for (const { ctrl, src } of activeControllers) {
        if (!ctrl || !ctrl.matrixWorld) continue;
        try {
          tempMatrix.identity().extractRotation(ctrl.matrixWorld);
          raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
          raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

          const gp = src ? src.gamepad : null;
          const triggerPressed = Boolean(gp && gp.buttons && gp.buttons[0] && gp.buttons[0].pressed);
          if (triggerPressed) primaryTriggerPressed = true;

          const hitTargets = [meshBottom, ...uiButtons];
          const hits = raycaster.intersectObjects(hitTargets);

          if (hits.length > 0) {
            const hit = hits[0];
            touchDot.position.copy(hit.point);
            touchDot.visible = true;
            anyHit = true;

            if (hit.object === meshBottom && hit.uv) {
              if (lastHoveredBtn) { lastHoveredBtn.userData.setHover(false); lastHoveredBtn = null; }
              const uv = hit.uv;
              const tx = Math.max(0, Math.min(319, Math.floor(uv.x * 320)));
              const ty = Math.max(0, Math.min(239, Math.floor((1.0 - uv.y) * 240)));
              if (Module && Module._web_touch) Module._web_touch(tx, ty, triggerPressed ? 1 : 0);
            } else if (hit.object.userData && hit.object.userData.onClick) {
              if (Module && Module._web_touch) Module._web_touch(0, 0, 0);
              if (lastHoveredBtn && lastHoveredBtn !== hit.object) {
                lastHoveredBtn.userData.setHover(false);
              }
              lastHoveredBtn = hit.object;
              lastHoveredBtn.userData.setHover(true);

              if (triggerPressed && !wasTriggerPressed) {
                hit.object.userData.onClick();
              }
            }
            break; // Stop after first pointing ray hit
          }
        } catch (e) {}
      }

      if (!anyHit) {
        touchDot.visible = false;
        if (Module && Module._web_touch) Module._web_touch(0, 0, 0);
        if (lastHoveredBtn) {
          lastHoveredBtn.userData.setHover(false);
          lastHoveredBtn = null;
        }
      }
      wasTriggerPressed = primaryTriggerPressed;
    }

    // -------------------------------------------------------------
    // Main Render Loop
    // -------------------------------------------------------------
    renderer.setAnimationLoop(() => {
      // 1. Advance Panda3DS Emulator Frame
      if (emuReady && emuRunning) {
        try {
          Module._web_frame();
          texLeft.needsUpdate = true;
          texRight.needsUpdate = true;
          texBottom.needsUpdate = true;
        } catch (err) {
          console.error('[Panda3DS] frame error:', err);
        }
      }

      // 2. Poll WebXR Input if in VR session
      try {
        if (renderer.xr.isPresenting) {
          camera.layers.set(0); // Parent camera holds only layer 0 so WebXRManager cameraL has 0+1 and cameraR has 0+2
          pollXRControllers();
        } else {
          camera.layers.set(0);
          camera.layers.enable(1); // Desktop view shows Left eye
          controls.update();
        }
      } catch (err) {
        console.warn('[WebXR] poll error:', err);
      }

      // 3. Render Three.js Scene
      renderer.render(scene, camera);

      // 4. Update FPS Counter
      frameCount++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        fps = Math.round((frameCount * 1000) / (now - lastTime));
        document.getElementById('fpsBadge').textContent = `${fps} FPS`;
        frameCount = 0;
        lastTime = now;
      }
    });


    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
