<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GL cost experiments</title>
<body style="background:#111;color:#8f8;font:13px ui-monospace,monospace;margin:8px">
<pre id="o">starting…</pre>
<iframe id="f" style="width:820px;height:1000px;border:0;background:#000"></iframe>
<script>
// A/B experiments on the cost of one frame, run from OUTSIDE the emulator page. After the guest reaches gameplay (start=<frame>), each experiment
// temporarily breaks one part of the WebGL traffic for n frames (the picture gets wrong, only the timing matters) and the GPU time per rendered frame
// is read with EXT_disjoint_timer_query_webgl2. Whatever makes the GPU time collapse is what costs.
//   ?rom=/run/commercial/sm3dl.3ds&start=900&n=24&name=probe-exp-sm3dl&extra=<more query for index.html>
const q = new URLSearchParams(location.search);
const rom = q.get('rom'), startFrame = +q.get('start') || 900, nMeasure = +q.get('n') || 24, name = q.get('name') || 'probe-exp', extra = q.get('extra') || '';
const o = document.getElementById('o'), f = document.getElementById('f');
const say = (s) => { o.textContent += s + '\n'; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const sum = (a) => a.reduce((x, y) => x + y, 0);
f.src = `/web/index.html?rom=${rom}&gl=1&name=${name}-inner${extra}`;

(async () => {
  let w; const t0 = performance.now();
  while (!((w = f.contentWindow) && w.Module && w.Module._web_frame && w.Module.jit)) { if (performance.now() - t0 > 120000) throw new Error('page did not start'); await sleep(250); }
  const T0 = performance.now(); let fr = 0;
  while ((fr = w.eval('typeof frames === "number" ? frames : 0')) < startFrame) { if (performance.now() - T0 > 600000) throw new Error('timeout at frame ' + fr); await sleep(500); }
  say('at frame ' + fr + '; running experiments');
  const canvas = w.document.getElementById('gl'), gl = canvas.getContext('webgl2');
  const ext = gl.getExtension('EXT_disjoint_timer_query_webgl2');
  if (!ext) throw new Error('no EXT_disjoint_timer_query_webgl2 in this browser');
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  const P = w.WebGL2RenderingContext.prototype;
  const O = {}; for (const k of Object.getOwnPropertyNames(P)) { let d; try { d = P[k]; } catch (e) { continue; } if (typeof d === 'function' && k !== 'constructor') O[k] = d; }   // pristine originals
  const drawNames = Object.keys(O).filter((k) => k.startsWith('draw'));
  let draws = 0;
  for (const k of drawNames) P[k] = function (...a) { draws++; return O[k].apply(this, a); };   // counting wrappers stay installed for the whole run

  const noop = (names, extraCount) => { const s = {}; for (const k of names) { s[k] = P[k]; P[k] = function () { if (extraCount && drawNames.includes(k)) draws++; }; } return () => { for (const k in s) P[k] = s[k]; }; };
  // upload byte counters (what the guest-side renderer pushes to the GPU per frame)
  let bytesUbo = 0, bytesVtx = 0, bytesIdx = 0, uploads = 0;
  const bsd = O.bufferSubData;
  P.bufferSubData = function (t, off, d) { uploads++; const n = arguments.length >= 5 ? arguments[4] : d.byteLength; /* Emscripten passes (target, off, HEAPU8, srcOffset, length): the real size is the 5th argument */ if (t === 35345) bytesUbo += n; else if (t === 34962) bytesVtx += n; else if (t === 34963) bytesIdx += n; return bsd.apply(this, arguments); };
  const skipTarget = (target) => { const prev = P.bufferSubData; P.bufferSubData = function (t, off, d) { if (t === target) { uploads++; return; } return prev.apply(this, arguments); }; return () => { P.bufferSubData = prev; }; };
  const skipTex = () => { const prev = P.texSubImage2D; P.texSubImage2D = function () {}; return () => { P.texSubImage2D = prev; }; };
  const EXP = {
    'baseline': () => () => {},
    'no uniform-buffer uploads': () => skipTarget(35345),
    'baseline (check 1)': () => () => {},
    'no index-buffer uploads': () => skipTarget(34963),
    'baseline (check 2)': () => () => {},
    'no vertex-buffer uploads': () => skipTarget(34962),
    'baseline (check 3)': () => () => {},
    'no texture uploads (texSubImage2D)': () => skipTex(),
    'baseline (check 4)': () => () => {},
  };

  const results = [];
  const only = q.get('only');   // only=baseline: run just the baseline experiments (quick A/B of one change)
  for (const [label, apply] of Object.entries(EXP).filter(([l]) => !only || l.startsWith(only))) {
    bytesUbo = bytesVtx = bytesIdx = uploads = 0; const undo = apply();
    const orig = w.Module._web_frame, recs = [], queries = []; let k = 0; const wall0 = performance.now();
    w.Module._web_frame = function () {
      if (k >= nMeasure) return orig();
      k++; const d0 = draws; const qo = gl.createQuery(); gl.beginQuery(ext.TIME_ELAPSED_EXT, qo);
      const t = performance.now(); const r = orig(); const ms = performance.now() - t; gl.endQuery(ext.TIME_ELAPSED_EXT);
      recs.push({ ms, draws: draws - d0 }); queries.push(qo); return r;
    };
    while (k < nMeasure) await sleep(50);
    const wall = performance.now() - wall0;
    w.Module._web_frame = orig; undo();
    await sleep(900);
    const gpu = queries.map((qo) => (gl.getQueryParameter(qo, gl.QUERY_RESULT_AVAILABLE) ? gl.getQueryParameter(qo, gl.QUERY_RESULT) / 1e6 : null));
    queries.forEach((qo) => gl.deleteQuery(qo));
    const heavy = recs.map((r, i) => ({ ...r, gpu: gpu[i] })).filter((r) => r.draws >= 20);   // frames that actually render
    const res = {
      experiment: label, uboKBperFrame: +(bytesUbo / 1024 / nMeasure).toFixed(0), vertexKBperFrame: +(bytesVtx / 1024 / nMeasure).toFixed(0), indexKBperFrame: +(bytesIdx / 1024 / nMeasure).toFixed(0), uploadsPerFrame: +(uploads / nMeasure).toFixed(0), wallMsPerFrame: +(wall / nMeasure).toFixed(1), emuMsMean: +(sum(recs.map((r) => r.ms)) / nMeasure).toFixed(1),
      renderFrames: heavy.length, drawsPerRenderFrame: heavy.length ? Math.round(sum(heavy.map((r) => r.draws)) / heavy.length) : 0,
      gpuMsPerRenderFrame: heavy.filter((r) => r.gpu !== null).length ? +(sum(heavy.filter((r) => r.gpu !== null).map((r) => r.gpu)) / heavy.filter((r) => r.gpu !== null).length).toFixed(1) : null,
    };
    results.push(res); say(JSON.stringify(res));
  }
  const out = { rom, name, startedAtFrame: fr, userAgent: navigator.userAgent, gpuRenderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : null, nMeasure, results };
  await fetch('/report?name=' + encodeURIComponent(name), { method: 'POST', body: JSON.stringify(out) });
  say('REPORT SENT');
})().catch(async (e) => { say('ERROR ' + e); await fetch('/report?name=' + encodeURIComponent(name), { method: 'POST', body: JSON.stringify({ error: String(e) }) }); });
</script>
